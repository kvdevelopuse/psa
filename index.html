<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Source Sans 3',system-ui,sans-serif;font-synthesis:style;color:#2A1619;background:#F7F2EA}
a{color:#9C1C33}a:hover{color:#7A1428}
input,select,textarea,button{font-family:'Source Sans 3',system-ui,sans-serif}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #9C1C33;outline-offset:2px}
.cond{font-family:'Young Serif',Georgia,serif;font-weight:400;text-transform:none!important;letter-spacing:0!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:268px;flex:none;background:#7A1428;color:#E8C3BC;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow:hidden}
.brand{flex:none;position:relative;overflow:hidden;padding:20px 22px 20px;background:#9C1C33}
.brand a{position:relative;display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
.brand p{position:relative;margin:12px 0 0;font-family:'Young Serif',Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#E8C3BC}
.nav{flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;padding:14px 14px}
.nav.navfoot{flex:none;padding:10px 14px 14px;box-shadow:inset 0 1px 0 #8E2338} /* Help, pinned to the bottom */
.nav .grp{padding:12px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#E8C3BC}
.nav .grp:first-child{padding-top:0}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 14px;border-radius:8px;text-decoration:none;font-size:15px;color:#FBEFE6;font-weight:500}
.nav a svg{flex:none;stroke:#E8C3BC}
.nav a:hover{background:#5F101F;color:#fff}
.nav a.on{background:#FFFDF9;color:#7A1428;font-weight:700}
.nav a.on svg{stroke:#7A1428}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#7A1428;color:#fff;font-family:'Young Serif',Georgia,serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.sidefoot{margin:0 14px 18px;padding:14px;border-radius:10px;background:#5F101F;display:flex;flex-direction:column;gap:10px;font-size:12px;color:#E8C3BC}
.sidefoot button{min-height:38px;border:0;border-radius:8px;background:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35);color:#fff;font-weight:600;font-size:14px;cursor:pointer}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:76px;flex:none;display:flex;flex-wrap:nowrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:0 32px;background:#FFFDF9;box-shadow:0 1px 0 #E6DCCD}
.top.notabs{padding-bottom:0}
.topr{flex:none;display:flex;align-items:center;gap:20px}
.who{display:flex;align-items:center;gap:12px;padding-left:20px;border-left:1px solid #E6DCCD;font-size:13px;color:#6E5D57;white-space:nowrap}
.who strong{color:#2A1619}
.iconbtn{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#7A1428;background:#F6E3E3;transition:background .15s}
.iconbtn:hover{background:#EFD3D4;color:#7A1428}
.iconbtn.on{background:#7A1428;color:#fff}
.top h1{white-space:nowrap}
@media (max-width:1180px){.whotxt{display:none}}
@media (max-width:1100px){.top{padding:0 20px;gap:16px}.topr{gap:12px}.who{padding-left:12px}.top .acts{gap:8px}.top .acts .btn,.who .btn{padding:0 14px}}
@media (max-width:1100px){.solbl{display:none}.who .btn{width:44px;padding:0}}
@media (max-width:1000px){.top{padding:0 16px}.top .acts{gap:6px}.top .acts .btn,.who .btn{padding:0 11px}}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#7A1428}
.top h1{margin:2px 0 0;font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.tabsbar{display:flex;flex-wrap:wrap;gap:4px;padding:0 24px;background:#FFFDF9;box-shadow:0 1px 0 #E6DCCD}
.tabsbar button{min-height:44px;padding:0 14px;border:0;background:transparent;font-weight:700;font-size:15px;cursor:pointer;color:#6E5D57}
.tabsbar button.on{color:#9C1C33;box-shadow:inset 0 -3px 0 #7A1428}
.page{padding:32px;width:100%;max-width:1240px;display:flex;flex-direction:column;gap:20px}
.page.wide{max-width:none;flex:1}
.acad2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px}
@media (max-width:960px){.acad2{grid-template-columns:minmax(0,1fr)}}
.page.wide:not(.tight)>section.card:last-of-type{flex:1 0 auto} /* list card fills the screen height */
.page.tight{padding-top:24px;gap:16px}
.card{background:#FFFDF9;border-radius:14px;box-shadow:0 0 0 1px #E6DCCD;overflow:hidden}
.cardhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 28px;border-bottom:1px solid #EDE4D6}
.cardhead h2{margin:0;font-family:'Young Serif',Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.16em;text-transform:uppercase}
.count{font-family:'Young Serif',Georgia,serif;font-weight:700;font-size:16px;letter-spacing:.06em;color:#9C1C33;background:#F6E3E3;padding:3px 10px;border-radius:4px;white-space:nowrap}
.chip{font-family:'Young Serif',Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.06em;color:#9C1C33;background:#F6E3E3;padding:3px 8px;border-radius:4px;white-space:nowrap}
.muted{color:#6E5D57}.small{font-size:13px}.tiny{font-size:12px}
.hint{font-size:12px;color:#6E5D57}
.err{font-size:12px;font-weight:600;color:#9C1C33}
.ok{font-size:12px;font-weight:600;color:#2F6B3A}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.b-red{background:#7A1428;color:#fff}.b-red:hover{color:#fff}
.b-blue{background:#9C1C33;color:#fff}.b-blue:hover{color:#fff}
.b-white{background:#FFFDF9;box-shadow:inset 0 0 0 1px #DCCFBC;color:#2A1619}
.b-soft{background:#F6E3E3;color:#7A1428}
.b-link{background:transparent;color:#9C1C33;padding:0 10px}
.b-danger{background:#FFFDF9;box-shadow:inset 0 0 0 2px #9C1C33;color:#9C1C33}
.b-green{background:#FFFDF9;box-shadow:inset 0 0 0 2px #2F6B3A;color:#2F6B3A}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:6px}
.btn.lg{min-height:48px;padding:0 24px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 6px;border:0;border-radius:6px;background:transparent;color:#9C1C33;font-weight:700;font-size:15px;cursor:pointer}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;padding:12px 16px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6E5D57;border-bottom:1px solid #E6DCCD;background:#F3ECE1;white-space:nowrap}
table.t td{padding:14px 16px;border-bottom:1px solid #EDE4D6;vertical-align:top}
table.t th:first-child,table.t td:first-child{padding-left:28px}
table.t th:last-child,table.t td:last-child{padding-right:28px}
table.t .r{text-align:right}
table.t .num{font-variant-numeric:tabular-nums}
tr.row{cursor:pointer;user-select:none}
tr.row:hover td{background:#F3ECE1}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:52px 24px;text-align:center}
.empty b{font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:28px;text-transform:uppercase;color:#9C1C33}
/* pills */
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.dot::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.p-on{background:#E7F1E2;color:#2F6B3A}.p-off{background:#EDE4D6;color:#6E5D57}.p-bad{background:#F6E3E3;color:#9C1C33}.p-up{background:#E6F1FB;color:#0C447C}.p-pend{background:#FAEFD6;color:#7D540B}
.flash{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#E7F1E2;color:#2F6B3A;font-size:14px;font-weight:700}
.flash::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.flash.bad{background:#F6E3E3;color:#9C1C33}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:#FBF3E4;font-size:14px;line-height:1.45;color:#4A3A35}
/* forms */
.formhead{display:flex;flex-direction:column;gap:6px;padding:28px 32px;border-bottom:1px solid #EDE4D6}
.bigtitle{margin:0;font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:44px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:#9C1C33;word-break:break-word}
.sec{padding:28px 32px 8px;display:flex;flex-direction:column;gap:22px}
.sec:last-of-type{padding-bottom:32px}
.band{display:flex;align-items:stretch;height:44px}
.band .l{width:52px;background:#7A1428;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:22px;border-radius:6px 0 0 6px}
.band h3{flex:1;margin:0;background:#9C1C33;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:19px;border-radius:0 6px 6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 24px}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld>label,.lbl{font-size:13px;font-weight:600;color:#4A3A35}
.req{color:#9C1C33}
.in{height:46px;width:100%;padding:0 14px;border:0;border-radius:6px;background:#F3ECE1;font-size:16px;font-weight:500;color:#2A1619}
textarea.in{height:auto;padding:12px 14px;line-height:1.5;resize:vertical}
.in.bad,.suffix.bad{background:#F6E3E3;box-shadow:inset 0 0 0 2px #9C1C33}
.in[readonly],.in:disabled{background:#F7F2EA;box-shadow:inset 0 0 0 1px #DCCFBC;color:#6E5D57}
.suffix{display:flex;align-items:center;height:46px;border-radius:6px;padding-right:14px;background:#F3ECE1}
.suffix input{flex:1;min-width:0;height:46px;padding:0 14px;border:0;background:transparent;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:#2A1619}
.suffix span{font-size:13px;font-weight:700;color:#6E5D57}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 96px;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:6px;cursor:pointer;font-size:15px;background:#F3ECE1;font-weight:500;color:#2A1619;border:0}
.opt.on{background:#F6E3E3;box-shadow:inset 0 0 0 2px #9C1C33;font-weight:700;color:#7A1428}
.opt input{accent-color:#9C1C33;width:18px;height:18px;margin:0}
.modes{display:flex;flex-wrap:wrap;gap:10px}
.mode{flex:1 1 120px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;background:#F3ECE1;color:#2A1619;font-weight:500;font-size:15px;cursor:pointer;border:0}
.mode.on{background:#F6E3E3;box-shadow:inset 0 0 0 2px #9C1C33;color:#7A1428;font-weight:700}
.foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;background:#FFFDF9;box-shadow:0 -1px 0 #E6DCCD;z-index:2}
.foot .msg{font-size:14px;color:#6E5D57}
.foot .msg.bad{color:#9C1C33;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:10px;background:#F3ECE1;min-width:0}
.tile .k{font-size:12px;font-weight:600;color:#6E5D57}
.tile .v{font-size:16px;font-weight:700;word-break:break-word}
.tile .v.n{font-weight:500;color:#4A3A35;font-size:15px;white-space:pre-wrap}
.kv{display:flex;flex-direction:column;gap:7px}
.kv .k{font-size:13px;font-weight:600;color:#4A3A35}.kv .v{font-size:16px;font-weight:500;white-space:pre-wrap;word-break:break-word}
.dethead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding:28px 32px;border-bottom:1px solid #EDE4D6}
.ini{flex:none;width:36px;height:36px;border-radius:50%;background:#9C1C33;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:'Young Serif',Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.04em}
.seg{display:flex;padding:4px;border-radius:10px;background:#EFE6D8}
.seg button{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:7px;background:transparent;font-weight:600;font-size:14px;color:#4A3A35;cursor:pointer}
.seg button.on{background:#FFFDF9;box-shadow:0 1px 2px rgba(42,22,25,.12);font-weight:700;color:#2A1619}
.seg .n{font-family:'Young Serif',Georgia,serif;font-weight:700;font-size:15px;color:#9C1C33}
.search{flex:1 1 280px;position:relative}
.search svg{position:absolute;left:14px;top:13px}
.search input{width:100%;height:44px;padding:0 14px 0 42px;border:0;border-radius:8px;background:#FFFDF9;box-shadow:inset 0 0 0 1px #DCCFBC;font-size:14px;font-weight:500;color:#2A1619}
.sel{height:40px;min-width:150px;padding:0 12px;border:0;border-radius:6px;background:#F3ECE1;font-size:15px;font-weight:600;color:#2A1619;cursor:pointer}
.monthnav{display:inline-flex;align-items:center;gap:4px}
.monthnav button.ar{width:40px;height:40px;border:0;border-radius:6px;background:#F3ECE1;color:#2A1619;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
[data-page=attendance] .monthnav .ml,[data-page=coachatt] .monthnav .ml,[data-page=reports] .monthnav .ml{color:#2A1619!important}
.monthnav .ml{min-width:170px;text-align:center;font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:#2A1619}
.stats{display:flex;flex-wrap:wrap;gap:16px}
.stat{flex:1 1 200px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;background:#FFFDF9;border-radius:14px;box-shadow:0 0 0 1px #E6DCCD}
.stat::before{content:'';position:absolute;left:0;top:0;width:100%;height:4px;background:var(--c,#9C1C33)}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#6E5D57}
.stat .v{font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-family:'Source Sans 3',system-ui,sans-serif;font-size:16px;font-weight:700;color:#6E5D57}
.stat .s{font-size:14px;color:#4A3A35}
/* dialogs */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px;background:rgba(42,22,25,.55);overflow-y:auto}
.dlg{width:100%;max-width:620px;background:#FFFDF9;border-radius:14px;box-shadow:0 24px 60px rgba(42,22,25,.35);overflow:hidden;margin:auto 0}
.dlg.w{max-width:720px}
.dh{position:relative;padding:22px 150px 20px 24px;background:#9C1C33;color:#fff;overflow:hidden}
.dh .e{position:relative;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#E8C3BC}
.dh h2{position:relative;margin:4px 0 0;font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase}
.dh .sub{position:relative;font-size:14px;color:#E8C3BC;margin-top:4px}
.dh .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.db{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.df{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;background:#F3ECE1;border-top:1px solid #E6DCCD}
.infobox{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:8px;background:#F3ECE1;box-shadow:inset 0 0 0 1px #E6DCCD;font-size:14px}
.line{display:flex;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid #EDE4D6}
.line .a{flex:1;display:flex;flex-direction:column;gap:2px}
.line .a b{font-weight:600;font-size:15px}
.line .amt{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:flex;align-items:baseline;gap:16px;padding:14px 16px;border-radius:8px;background:#F6E3E3}
.tot span:first-child{flex:1;font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.tot span:last-child{font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
/* attendance grid */
.th-date{position:relative}
.tip{position:absolute;top:calc(100% - 4px);left:50%;transform:translateX(-50%);z-index:5;display:none;width:220px;padding:10px 12px;border-radius:8px;background:#2A1619;color:#fff;font-size:13px;font-weight:500;line-height:1.4;text-align:left;letter-spacing:0;text-transform:none;pointer-events:none;box-shadow:0 6px 18px rgba(42,22,25,.22)}
.th-date:hover .tip,.th-date:focus-within .tip,.cellw:hover .tip{display:block}
.cellw{position:relative}
.th-date .tip,.cellw .tip{display:none!important}
#ftip{position:fixed;transform:none;z-index:60}
.datebtn{width:48px;min-height:48px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.datebtn:hover{background:#F6E3E3}
.datebtn .dw{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6E5D57}
.datebtn .dd{font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:20px;line-height:1;color:#2A1619}
.datebtn.fut .dd,.datebtn.fut .dw{color:#A08F86}
.datebtn.today{box-shadow:inset 0 0 0 2px #9C1C33;background:#FFFDF9}
.mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:6px;font-weight:800;font-size:14px}
.markbtn{border:0;padding:0;cursor:pointer;font-family:inherit}
.markbtn:hover{box-shadow:0 0 0 2px #9C1C33}
.m-p{background:#E7F1E2;color:#2F6B3A}.m-a{background:#9C1C33;color:#fff}.m-u{background:#F7F2EA;box-shadow:inset 0 0 0 1px #E6DCCD}.m-n{color:#A08F86}
.namebtn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0;border:0;background:transparent;cursor:pointer;text-align:left;color:#2A1619}
.namebtn:hover .nm{text-decoration:underline}
.sticky{position:sticky;left:0;z-index:1;background:#FFFDF9}
th.sticky{background:#F3ECE1}
.toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:132px;padding:0 18px;border:0;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:13px;color:#4A3A35}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cmin{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 4px;border-radius:6px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
/* student profile */
.prof .bandtop{position:relative;height:112px;background:#9C1C33;overflow:hidden}
.prof .bandtop .big{position:absolute;left:260px;bottom:18px;font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:120px;line-height:.8;color:#8E2338}
.prof .bandtop .bk{position:absolute;left:20px;top:16px;color:#fff}
.ptabs{display:flex;gap:4px;padding:0 20px;border-top:1px solid #EDE4D6}
.ptabs button{display:flex;align-items:center;gap:8px;min-height:52px;padding:0 14px;border:0;background:transparent;font-size:15px;color:#6E5D57;font-weight:600;cursor:pointer}
.ptabs button.on{color:#2A1619;font-weight:700;box-shadow:inset 0 -3px 0 #7A1428}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bt-card{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:10px;background:#F3ECE1;box-shadow:inset 0 0 0 1px #E6DCCD}
.bt-card .nm{font-family:'Young Serif',Georgia,serif;font-weight:800;font-size:24px;text-transform:uppercase;color:#9C1C33}
.bt-card .nm.dim{color:#A08F86}
/* receipt */
.rc{width:794px;max-width:100%;min-height:1123px;background:#FFFDF9;color:#2A1619;display:flex;flex-direction:column;position:relative;overflow:hidden;margin:0 auto}
.rc-top{position:relative;padding:40px 56px 34px;background:#9C1C33;color:#fff;overflow:hidden}
.rk{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#6E5D57}
.setnav a{display:flex;align-items:center;justify-content:space-between;min-height:44px;padding:0 14px;border-radius:8px;color:#2A1619;font-weight:600;text-decoration:none}
.setnav a.on{background:#FFFDF9;box-shadow:0 0 0 1px #E6DCCD;font-weight:700}
.setnav a:hover{background:#FFFDF9}
.vb{display:flex;align-items:center;min-height:46px;padding:10px 14px;border-radius:6px;background:#F3ECE1;box-shadow:inset 0 0 0 1px #E6DCCD;font-size:16px;font-weight:600;color:#2A1619;word-break:break-word;min-width:0}
.vb.multi{align-items:flex-start;min-height:92px;white-space:pre-wrap;line-height:1.5;font-weight:500}
.vb.none{color:#A08F86;font-weight:500}
.opt.vo{cursor:default;background:#F3ECE1;box-shadow:inset 0 0 0 1px #E6DCCD;color:#A08F86}
.opt.vo.on{background:#F6E3E3;box-shadow:inset 0 0 0 2px #9C1C33;color:#7A1428}
.opt.vo .rd{width:18px;height:18px;flex:none;border-radius:50%;background:#FFFDF9;box-shadow:inset 0 0 0 2px #CDBFAE}
.opt.vo.on .rd{box-shadow:inset 0 0 0 5px #9C1C33}
.tw.cal{overflow-x:auto;scrollbar-width:auto;scrollbar-color:#A08F86 #EDE4D6}
.tw.cal::-webkit-scrollbar{height:14px}
.tw.cal::-webkit-scrollbar-track{background:#EDE4D6}
.tw.cal::-webkit-scrollbar-thumb{background:#A08F86;border-radius:7px;border:3px solid #EDE4D6}
.tw.cal::-webkit-scrollbar-thumb:hover{background:#6E5D57}
.itip{position:relative;display:inline-flex;align-items:center;cursor:help;border-radius:50%}
.itip svg{margin-top:0!important}
.itip:hover .tip,.itip:focus .tip{display:block}
.statbtn{border:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
.statbtn:hover{box-shadow:0 0 0 1px #DCCFBC,0 4px 14px rgba(42,22,25,.08)}
.statbtn.on{box-shadow:inset 0 0 0 2px var(--c),0 4px 14px rgba(42,22,25,.08);background:#FBF6EE}
/* ===== Theme from styling/theme.png: maroon #7A1428/#9C1C33, cream #F7F2EA, gold #C9A04A, Young Serif + Source Sans 3 ===== */
body{background:#F7F2EA}
a:hover{color:#7A1428}
.eyebrow{color:#9C1C33}
.side{background:#7A1428;color:#E8C3BC}
.brand{height:76px;padding:0 22px;display:flex;align-items:center;justify-content:center;background:transparent;border-bottom:0;box-shadow:0 1px 0 #8E2338}
.brand a{flex-direction:column;justify-content:center;gap:0}
.brand img{display:block;height:53px;width:auto;filter:drop-shadow(0 3px 8px rgba(0,0,0,.22));transition:transform .25s}
.brand a:hover img{transform:scale(1.04)}
.brand p{text-align:center;margin-top:16px;color:#E8C3BC;font-family:'Young Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:19px;letter-spacing:0;text-transform:none}
.nav .grp{color:#E8C3BC}
.nav a{color:#FBEFE6;font-size:16px;transition:background .15s,color .15s}
.nav a svg{stroke:#E8C3BC}
.nav a:hover{background:rgba(0,0,0,.16);color:#fff}
.nav a.on{background:#FFFDF9;color:#7A1428;box-shadow:inset 4px 0 0 #C9A04A}
.nav a.on svg{stroke:#7A1428}
.nav .badge{background:#C9A04A;color:#2A1619}
.nav a.on .badge{background:#C9A04A}
.sidefoot{background:#5F101F;color:#E8C3BC}
.sidefoot button{box-shadow:inset 0 0 0 1px #E8C3BC;color:#FBEFE6;transition:background .15s}
.sidefoot button:hover{background:rgba(255,255,255,.12)}
.top{position:relative}
.top h1{color:#2A1619;font-size:34px}
.tabsbar button.on{color:#2A1619;box-shadow:inset 0 -3px 0 #9C1C33}
.ptabs button.on{box-shadow:inset 0 -3px 0 #9C1C33}
.btn{transition:background .15s,box-shadow .15s,transform .08s,color .15s}
.btn:not([disabled]):active{transform:translateY(1px)}
.b-blue{box-shadow:0 4px 12px rgba(156,28,51,.22)}
.b-blue:hover{background:#7A1428}
.b-red:hover{background:#000}
.b-soft{color:#7A1428}
.b-soft:hover{background:#EFD3D4}
.b-white:hover{box-shadow:inset 0 0 0 1px #CDBFAE;background:#FBF6EE}
.b-link:hover{color:#7A1428;text-decoration:underline}
.card{box-shadow:0 0 0 1px #E6DCCD,0 2px 6px rgba(42,22,25,.04)}
.stat{box-shadow:0 0 0 1px #E6DCCD,0 2px 6px rgba(42,22,25,.04)}
.in,.suffix,.sel,.opt,.mode{transition:background .15s,box-shadow .15s}
.in:focus,.sel:focus,.suffix:focus-within{background:#FFFDF9;box-shadow:inset 0 0 0 2px #9C1C33;outline:none}
.in.bad:focus{background:#F6E3E3}
.search input:focus{box-shadow:inset 0 0 0 2px #9C1C33;outline:none}
.opt:hover,.mode:hover{background:#EAE0D0}
.opt.on:hover,.mode.on:hover{background:#F6E3E3}
tr.row:hover td{background:#FBF6EE}
tr.row:hover td:first-child{box-shadow:inset 3px 0 0 #9C1C33}
tr.unpaid td{background:#F6E3E3}
tr.unpaid td:first-child{box-shadow:inset 4px 0 0 #9C1C33}
.seg button.on{box-shadow:0 1px 3px rgba(42,22,25,.14)}
.empty b{color:#9C1C33}
.brand p,.top h1,.cardhead h2,.empty b,.bigtitle,.band h3,.monthnav .ml,.dh h2,.tot span,.bt-card .nm,.hp-h h2,.stat .v,.prof .bandtop .big{text-transform:none;letter-spacing:0;font-weight:400}
.count,.chip,.nav .badge,.ini,.seg .n,.datebtn .dd{font-family:'Source Sans 3',system-ui,sans-serif;letter-spacing:0}
.stat .v{font-size:40px}
::selection{background:#F0CFCF;color:#2A1619}
@media print{
 body.printing .app,body.printing .ov .rbar{display:none!important}
 body.printing .ov{position:static;padding:0;background:#FFFDF9;display:block}
 body.printing .rc{box-shadow:none}
 @page{size:A4;margin:0}
}
@media (max-width:900px){.side{width:220px}.page{padding:20px}}

/* help */
.top .tt{display:flex;align-items:center;gap:12px}
.qhelp{flex:none;width:30px;height:30px;border:0;border-radius:50%;background:#F6E3E3;color:#9C1C33;box-shadow:0 0 0 2px #9C1C33;font:800 17px/1 'Source Sans 3',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;margin-top:2px}
.qhelp:hover,.qhelp.on{background:#9C1C33;color:#fff}
.qhelp:focus-visible{outline:3px solid #7A1428;outline-offset:2px}
.hp-ov{position:fixed;inset:0;background:rgba(42,22,25,.35);z-index:60}
.hp{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100vw;background:#FFFDF9;z-index:61;box-shadow:-12px 0 40px rgba(42,22,25,.25);display:flex;flex-direction:column}
.hp-h{position:relative;overflow:hidden;background:#9C1C33;color:#fff;padding:20px 110px 18px 22px;flex:none}
.hp-h .e{position:relative;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#E8C3BC}
.hp-h h2{position:relative;margin:4px 0 0;font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:26px;line-height:1.05}
.hp-h .x{position:absolute;right:12px;top:12px;width:36px;height:36px;border:0;border-radius:8px;background:rgba(255,255,255,.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.hp-b{flex:1;overflow:auto;padding:18px 22px;display:flex;flex-direction:column;gap:12px;font-size:14px;line-height:1.5;color:#2A1619}
.hp-b p{margin:0}
.hp-b ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.hp-b li{display:flex;gap:10px}
.hp-b .n{flex:none;width:22px;height:22px;border-radius:50%;background:#F6E3E3;color:#7A1428;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.hk{display:inline-block;padding:1px 8px;border-radius:5px;font-weight:700;font-size:12.5px;line-height:1.6;white-space:nowrap;vertical-align:baseline}
.hk.r{background:#7A1428;color:#fff}.hk.b{background:#9C1C33;color:#fff}.hk.w{background:#FFFDF9;color:#2A1619;box-shadow:inset 0 0 0 1px #DCCFBC}
.hbox{padding:10px 12px;border-radius:8px;font-size:13px}
.hbox.htip{background:#F6E3E3}.hbox.htip b{color:#7A1428}
.hbox.himp{background:#F6E3E3}.hbox.himp b{color:#9C1C33}
.hp-pdf{display:flex;align-items:center;gap:12px;padding:12px 14px;border:2px solid #9C1C33;border-radius:10px;color:#7A1428;text-decoration:none;background:#FBF6EE}
.hp-pdf:hover{background:#F6E3E3}
.hp-pdf span{display:flex;flex-direction:column}.hp-pdf small{color:#6E5D57;font-size:12.5px}
.hp-pdf .ar{margin-left:auto;font-weight:800}
.hp-f{flex:none;margin-top:auto;padding:14px 22px;border-top:1px solid #E6DCCD;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hp-f span{font-size:12px;color:#6E5D57}

const KEY = 'psa_student_app_v2';

const isoOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const toD = (s) => { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); };
const NOW = new Date();
const TODAY = isoOf(NOW);
const CUR_YM = TODAY.slice(0, 7);
const fmtD = (s) => { if (!s) return '—'; const d = toD(s); return pad(d.getDate()) + '-' + MON[d.getMonth()] + '-' + d.getFullYear(); };
const fmtShort = (s) => { const d = toD(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtLong = (s) => fmtShort(s) + ' ' + toD(s).getFullYear();
const fmtWhen = (iso) => { const t = new Date(iso); return pad(t.getDate()) + '-' + MON[t.getMonth()] + '-' + t.getFullYear() + ', ' + pad(t.getHours()) + ':' + pad(t.getMinutes()); };
const ymShift = (ym, k) => { const y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + k; const d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const ymLabel = (ym) => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const ymShort = (ym) => MON[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);

const q = (s) => '“' + s + '”';
const daysText = (ids) => DAYS.filter((d) => (ids || []).includes(d[0])).map((d) => d[1]).join(', ');
const dowsOf = (ids) => DAYS.filter((d) => (ids || []).includes(d[0])).map((d) => d[3]);
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : (b || a + 's'));
const NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function words(n) {
  n = Math.floor(n);
  if (n < 20) return NUM_WORDS[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + NUM_WORDS[n % 10] : '');
  if (n < 1000) return NUM_WORDS[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' and ' + words(n % 100) : '');
  if (n < 1000000) return words(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? (n % 1000 < 100 ? ' and ' : ' ') + words(n % 1000) : '');
  return String(n);
}

/* ============ P & L › REVENUE ============ */
function rvEnsure() { if (!Array.isArray(S.revenue)) S.revenue = []; if (!Array.isArray(S.revHist)) S.revHist = []; if (!Array.isArray(S.revAutoDel)) S.revAutoDel = []; }
// Automatic entries: every fee month gets a Registration Fee, Transport Fee and Batch Fee entry per location.
// Amounts = paid dues of that fee month, by the location of the student's batch (students with no batch are left out).
// The due's discount comes off the Batch Fee. An entry follows the fee payments until it is edited by hand;
// a deleted automatic entry is remembered in S.revAutoDel and is not made again.
const RV_AUTO = { reg: 'Registration Fee', transport: 'Transport Fee', batch: 'Batch Fee' }; // listed in this order
function rvAutoTotals() {
  const t = {};
  S.dues.forEach((d) => {
    if (!d.payment || !d.month) return;
    const r = S.brec[d.studentId]; const b = r && byId(S.batches, r.batchId); if (!b || !byId(S.locations, b.locationId)) return;
    const part = { batch: Math.max(0, (d.batchFee || 0) - (d.discount ? d.discount.amount : 0)), transport: d.transportFee || 0, reg: d.regFee || 0 };
    Object.keys(RV_AUTO).forEach((k) => { if (part[k] > 0) { const key = d.month + '|' + k + '|' + b.locationId; t[key] = (t[key] || 0) + part[k]; } });
  });
  Object.keys(t).forEach((k) => { t[k] = Math.round(t[k] * 100) / 100; });
  return t;
}
function rvAutoSync() {
  const t = rvAutoTotals(); const now = new Date().toISOString(); let changed = false;
  const byKey = {}; S.revenue.forEach((x) => { if (x.autoKey) byKey[x.autoKey] = x; });
  const ord = Object.keys(RV_AUTO); const kOf = (k) => k.split('|');
  Object.keys(t).sort((a, b) => { const x = kOf(a), y = kOf(b); return x[0].localeCompare(y[0]) || locName(x[2]).localeCompare(locName(y[2])) || ord.indexOf(x[1]) - ord.indexOf(y[1]); }).forEach((key) => {
    const x = byKey[key];
    if (x) {
      if (!x.edited && x.amount !== t[key]) { rvLog(x.id, fmtD(x.date) + ' · ' + x.description, locName(x.locationId), 'Amount updated from fee payments', money2(x.amount), money2(t[key])); x.amount = t[key]; changed = true; }
      return;
    }
    if (S.revAutoDel.includes(key)) return;
    const [ym, k, loc] = key.split('|');
    const n = { id: uid('rv'), at: now, date: ym + '-01', locationId: loc, description: RV_AUTO[k], remarks: '', amount: t[key], autoKey: key, edited: false };
    S.revenue.push(n); rvLog(n.id, fmtD(n.date) + ' · ' + n.description, locName(loc), 'Created from fee payments', '—', rvSum(n)); changed = true;
  });
  // a payment was removed and nothing is left for that month and location: drop the entry (it comes back if fees are paid again)
  const gone = S.revenue.filter((x) => x.autoKey && !rvIsCamp(x) && !x.edited && !t[x.autoKey]);
  gone.forEach((x) => { rvLog(x.id, fmtD(x.date) + ' · ' + x.description, locName(x.locationId), 'Removed, no fee payments left', rvSum(x), '—'); changed = true; });
  if (gone.length) S.revenue = S.revenue.filter((x) => !gone.includes(x));
  if (changed) save();
  rvCampSync(); // camp payments: separate automatic entries
}
const RV_AUTO_TAG = '<span style="display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:#EFE6D6;color:#6B5A3A;font-size:12px;font-weight:700;vertical-align:1px">Auto</span>';

const rvSum = (x) => fmtD(x.date) + ' · ' + locName(x.locationId) + ' · AED ' + money2(x.amount) + ' · ' + x.description;
const rvCmp = (a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : (b.at || '').localeCompare(a.at || '')); // newest date first

/* ============ CAMPS ============ */
// camp: { id, name, description, from, to, fees: { d, w, m, f } (AED or null = not offered), students: [enrolment] }
// enrolment: { id, sid, opt: 'd'|'w'|'m'|'f', qty, start, end, rate, discount (AED, 0 if none), pct ('' or the % typed), remarks, added, payments: [payment] }
// payment: { id, date, amount, mode, ref, chequeNo, bank, chequeDate, remarks, receiptNo, by } · a camp fee can be paid in parts
const CAMP_OPTS = [['d', 'Daily', 'day', 'Fee for one camp day.'], ['w', 'Weekly', 'week', 'Fee for one camp week (7 days).'], ['m', 'Monthly', 'month', 'Fee for one camp month.'], ['f', 'Full camp', 'camp', 'Fee for the whole camp.']];
const optName = (k) => (CAMP_OPTS.find((o) => o[0] === k) || [])[1] || '';
const optUnit = (k, n) => { const u = (CAMP_OPTS.find((o) => o[0] === k) || [])[2] || ''; return n + ' ' + u + (n === 1 ? '' : 's'); };
const campOf = (id) => byId(S.camps, id);

// which help topic fits the screen that is open now
function helpTopic() {
  const v = (U.v && U.v.view) || '';
  if (v === 'collect') return 'collect';
  switch (U.page) {
    case 'batches': return v === 'locList' || v === 'locForm' ? 'locations' : 'batches';
    case 'registration': return v === 'student' ? (U.v.tab === 'tournaments' ? 'studentTours' : 'assign') : 'register';
    case 'tournaments': return v === 'squads' ? 'squads' : 'tournaments';
    case 'camps': return v === 'students' ? 'campStudents' : v === 'fees' ? 'campFees' : v === 'people' ? 'campPeople' : 'camps';
    case 'changepw': return 'settings';
    default: return HELP[U.page] ? U.page : 'batches';
  }
}
function helpBtn() {
  return '<button type="button" class="qhelp' + (U.help ? ' on' : '') + '" aria-label="Help for this page" title="Help for this page" onclick="openHelp()">?</button>';

function openHelp() { U.help = true; render(); const x = document.querySelector('.hp .x'); if (x) x.focus(); }
function closeHelp() { U.help = false; render(); const b = document.querySelector('.qhelp'); if (b) b.focus(); }
// attendance tooltips (dates, coach cells) are drawn in one body-level box so the scrolling table can't cut them off
const FTIP = (() => {
  const box = document.createElement('div'); box.className = 'tip'; box.id = 'ftip'; box.setAttribute('aria-hidden', 'true'); document.body.appendChild(box);
  let host = null;
  const hide = () => { host = null; box.style.display = 'none'; };
  const show = (hst) => {
    const t = hst.querySelector('.tip'); if (!t) return hide();
    if (host === hst) return; host = hst;
    box.innerHTML = t.innerHTML; box.style.width = t.style.width || ''; box.style.display = 'block';
    const rc = hst.getBoundingClientRect(); const w = box.offsetWidth, ht = box.offsetHeight;
    const x = Math.max(8, Math.min(rc.left + rc.width / 2 - w / 2, window.innerWidth - w - 8));
    let y = rc.bottom + 6; if (y + ht > window.innerHeight - 8) y = Math.max(8, rc.top - ht - 6); // flip above when no room below
    box.style.left = x + 'px'; box.style.top = y + 'px';
  };
  const pick = (e) => { const hst = e.target.closest && e.target.closest('.th-date,.cellw'); if (hst) show(hst); else hide(); };
  document.addEventListener('mouseover', pick); document.addEventListener('focusin', pick);
  document.addEventListener('focusout', hide); window.addEventListener('scroll', hide, true); document.addEventListener('click', hide);
  return { hide };
})();
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && U && U.help && !U.dlg) closeHelp(); });

    '<span><b>See this with screenshots</b><small>Opens Help.pdf at page ' + t.page + '</small></span><span class="ar" aria-hidden="true">↗</span></a>') + '</div>' +

// open Settings at the section that needs filling in
function fixIt(section, field) {
  if (U.f && (U.v.view === 'form') && !confirm('Leave this form and open Settings? What you have typed here is not saved.')) return;
  location.hash = '#settings'; go('settings'); U.v.sec = section; render();
  const sec = document.getElementById(section); if (!sec) return;
  sec.scrollIntoView({ block: 'start' }); sec.classList.add('fixhl');
  const f = document.getElementById(field); if (f) f.focus({ preventScroll: true });
  setTimeout(() => { const s2 = document.getElementById(section); if (s2) s2.classList.remove('fixhl'); }, 2500);
}
