<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peak Sports Academy — Student Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Barlow,system-ui,sans-serif;color:#15172B;background:#F3F3F7}
a{color:#2A3A9E}a:hover{color:#1B2466}
input,select,textarea,button{font-family:Barlow,system-ui,sans-serif}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid #2A3A9E;outline-offset:2px}
.cond{font-family:'Barlow Condensed',sans-serif}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:268px;flex:none;background:#1B2466;color:#C9CDF0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{flex:none;position:relative;overflow:hidden;padding:20px 22px 20px;background:#2A3A9E}
.brand .s1{position:absolute;right:-52px;top:-10px;width:70px;height:160px;background:#D7262E;transform:skewX(-20deg)}
.brand .s2{position:absolute;right:24px;top:-10px;width:8px;height:160px;background:#fff;transform:skewX(-20deg)}
.brand a{position:relative;display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
.brand p{position:relative;margin:12px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:#DCE0FF}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;padding:14px 14px}
.nav .grp{padding:12px 14px 4px;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#8F96CF}
.nav .grp:first-child{padding-top:0}
.nav a{display:flex;align-items:center;gap:12px;min-height:40px;padding:0 14px;border-radius:8px;text-decoration:none;font-size:15px;color:#D4D8F4;font-weight:500}
.nav a svg{flex:none;stroke:#9AA1D8}
.nav a:hover{background:#232E7A;color:#fff}
.nav a.on{background:#fff;color:#1B2466;font-weight:700}
.nav a.on svg{stroke:#D7262E}
.nav .badge{margin-left:auto;min-width:22px;height:22px;padding:0 6px;border-radius:999px;background:#D7262E;color:#fff;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.sidefoot{margin:0 14px 18px;padding:14px;border-radius:10px;background:#232E7A;display:flex;flex-direction:column;gap:10px;font-size:12px;color:#B5BBE8}
.sidefoot button{min-height:38px;border:0;border-radius:8px;background:transparent;box-shadow:inset 0 0 0 1px #4A55A3;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{min-height:76px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:12px 32px 4px;background:#fff;box-shadow:0 1px 0 #E3E4EC}
.top.notabs{padding-bottom:12px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#D7262E}
.top h1{margin:2px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.tabsbar{display:flex;flex-wrap:wrap;gap:4px;padding:0 24px;background:#fff;box-shadow:0 1px 0 #E3E4EC}
.tabsbar button{min-height:44px;padding:0 14px;border:0;background:transparent;font-weight:700;font-size:15px;cursor:pointer;color:#5E6280}
.tabsbar button.on{color:#2A3A9E;box-shadow:inset 0 -3px 0 #D7262E}
.page{padding:32px;width:100%;max-width:1240px;display:flex;flex-direction:column;gap:20px}
.page.wide{max-width:none;flex:1}
.acad2{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:24px}
@media (max-width:960px){.acad2{grid-template-columns:minmax(0,1fr)}}
.page.wide:not(.tight)>section.card:last-of-type{flex:1 0 auto} /* list card fills the screen height */
.page.tight{padding-top:24px;gap:16px}
.card{background:#fff;border-radius:14px;box-shadow:0 0 0 1px #E3E4EC;overflow:hidden}
.cardhead{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 28px;border-bottom:1px solid #ECEDF3}
.cardhead h2{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:20px;letter-spacing:.16em;text-transform:uppercase}
.count{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:16px;letter-spacing:.06em;color:#2A3A9E;background:#E9ECFA;padding:3px 10px;border-radius:4px;white-space:nowrap}
.chip{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.06em;color:#2A3A9E;background:#E9ECFA;padding:3px 8px;border-radius:4px;white-space:nowrap}
.muted{color:#5E6280}.small{font-size:13px}.tiny{font-size:12px}
.hint{font-size:12px;color:#5E6280}
.err{font-size:12px;font-weight:600;color:#A3141B}
.ok{font-size:12px;font-weight:600;color:#17663A}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border:0;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.b-red{background:#D7262E;color:#fff}.b-red:hover{color:#fff}
.b-blue{background:#2A3A9E;color:#fff}.b-blue:hover{color:#fff}
.b-white{background:#fff;box-shadow:inset 0 0 0 1px #DADBE6;color:#15172B}
.b-soft{background:#E9ECFA;color:#1B2466}
.b-link{background:transparent;color:#2A3A9E;padding:0 10px}
.b-danger{background:#fff;box-shadow:inset 0 0 0 2px #D7262E;color:#A3141B}
.b-green{background:#fff;box-shadow:inset 0 0 0 2px #17663A;color:#17663A}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:6px}
.btn.lg{min-height:48px;padding:0 24px}
.back{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 12px 0 6px;border:0;border-radius:6px;background:transparent;color:#2A3A9E;font-weight:700;font-size:15px;cursor:pointer}
/* tables */
.tw{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;padding:12px 16px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#5E6280;border-bottom:1px solid #E3E4EC;background:#F7F7FA;white-space:nowrap}
table.t td{padding:14px 16px;border-bottom:1px solid #ECEDF3;vertical-align:top}
table.t th:first-child,table.t td:first-child{padding-left:28px}
table.t th:last-child,table.t td:last-child{padding-right:28px}
table.t .r{text-align:right}
table.t .num{font-variant-numeric:tabular-nums}
tr.row{cursor:pointer;user-select:none}
tr.row:hover td{background:#F7F7FA}
.clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:52px 24px;text-align:center}
.empty b{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;text-transform:uppercase;color:#2A3A9E}
/* pills */
.pill{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.dot::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.p-on{background:#E3F4EA;color:#17663A}.p-off{background:#ECEDF3;color:#5E6280}.p-bad{background:#FDECEC;color:#A3141B}.p-up{background:#E6F1FB;color:#0C447C}.p-pend{background:#FFF4DE;color:#7A4A00}
.flash{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:#E3F4EA;color:#17663A;font-size:14px;font-weight:700}
.flash::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.flash.bad{background:#FDF1F1;color:#A3141B}
.note{display:flex;gap:10px;padding:12px 14px;border-radius:8px;background:#E9ECFA;font-size:14px;line-height:1.45;color:#3B3F5C}
/* forms */
.formhead{display:flex;flex-direction:column;gap:6px;padding:28px 32px;border-bottom:1px solid #ECEDF3}
.bigtitle{margin:0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:44px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:#2A3A9E;word-break:break-word}
.sec{padding:28px 32px 8px;display:flex;flex-direction:column;gap:22px}
.sec:last-of-type{padding-bottom:32px}
.band{display:flex;align-items:stretch;height:44px}
.band .l{width:52px;background:#D7262E;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;clip-path:polygon(0 0,100% 0,80% 100%,0 100%)}
.band h3{flex:1;margin:0 0 0 -8px;background:#2A3A9E;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px 0 26px;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:18px;letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 24px}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:7px;min-width:0}
.fld>label,.lbl{font-size:13px;font-weight:600;color:#3B3F5C}
.req{color:#D7262E}
.in{height:46px;width:100%;padding:0 14px;border:0;border-radius:6px;background:#ECEAF2;font-size:16px;font-weight:500;color:#15172B}
textarea.in{height:auto;padding:12px 14px;line-height:1.5;resize:vertical}
.in.bad,.suffix.bad{background:#FDF1F1;box-shadow:inset 0 0 0 2px #D7262E}
.in[readonly],.in:disabled{background:#F4F4F8;box-shadow:inset 0 0 0 1px #DADBE6;color:#5E6280}
.suffix{display:flex;align-items:center;height:46px;border-radius:6px;padding-right:14px;background:#ECEAF2}
.suffix input{flex:1;min-width:0;height:46px;padding:0 14px;border:0;background:transparent;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:#15172B}
.suffix span{font-size:13px;font-weight:700;color:#5E6280}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 96px;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 14px;border-radius:6px;cursor:pointer;font-size:15px;background:#ECEAF2;font-weight:500;color:#15172B;border:0}
.opt.on{background:#E9ECFA;box-shadow:inset 0 0 0 2px #2A3A9E;font-weight:700;color:#1B2466}
.opt input{accent-color:#2A3A9E;width:18px;height:18px;margin:0}
.modes{display:flex;flex-wrap:wrap;gap:10px}
.mode{flex:1 1 120px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border-radius:8px;background:#ECEAF2;color:#15172B;font-weight:500;font-size:15px;cursor:pointer;border:0}
.mode.on{background:#E9ECFA;box-shadow:inset 0 0 0 2px #2A3A9E;color:#1B2466;font-weight:700}
.foot{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;background:#fff;box-shadow:0 -1px 0 #E3E4EC;z-index:2}
.foot .msg{font-size:14px;color:#5E6280}
.foot .msg.bad{color:#A3141B;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:10px;background:#F7F7FA;min-width:0}
.tile .k{font-size:12px;font-weight:600;color:#5E6280}
.tile .v{font-size:16px;font-weight:700;word-break:break-word}
.tile .v.n{font-weight:500;color:#3B3F5C;font-size:15px;white-space:pre-wrap}
.kv{display:flex;flex-direction:column;gap:7px}
.kv .k{font-size:13px;font-weight:600;color:#3B3F5C}.kv .v{font-size:16px;font-weight:500;white-space:pre-wrap;word-break:break-word}
.dethead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding:28px 32px;border-bottom:1px solid #ECEDF3}
.ini{flex:none;width:36px;height:36px;border-radius:50%;background:#2A3A9E;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;letter-spacing:.04em}
.frame{width:36px;height:42px;flex:none;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 2px #D7262E;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:15px;color:#2A3A9E;background:#fff}
.frame.off{box-shadow:inset 0 0 0 2px #B9BBCC}
.seg{display:flex;padding:4px;border-radius:10px;background:#E6E6EE}
.seg button{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 16px;border:0;border-radius:7px;background:transparent;font-weight:600;font-size:14px;color:#3B3F5C;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 2px rgba(21,23,43,.12);font-weight:700;color:#15172B}
.seg .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:15px;color:#2A3A9E}
.search{flex:1 1 280px;position:relative}
.search svg{position:absolute;left:14px;top:13px}
.search input{width:100%;height:44px;padding:0 14px 0 42px;border:0;border-radius:8px;background:#fff;box-shadow:inset 0 0 0 1px #DADBE6;font-size:14px;font-weight:500;color:#15172B}
.sel{height:40px;min-width:150px;padding:0 12px;border:0;border-radius:6px;background:#ECEAF2;font-size:15px;font-weight:600;color:#15172B;cursor:pointer}
.monthnav{display:inline-flex;align-items:center;gap:4px}
.monthnav button.ar{width:40px;height:40px;border:0;border-radius:6px;background:#ECEAF2;color:#15172B;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.monthnav .ml{min-width:170px;text-align:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:#2A3A9E}
.stats{display:flex;flex-wrap:wrap;gap:16px}
.stat{flex:1 1 200px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;background:#fff;border-radius:14px;box-shadow:0 0 0 1px #E3E4EC}
.stat::before{content:'';position:absolute;left:0;top:0;width:100%;height:4px;background:var(--c,#2A3A9E)}
.stat .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#5E6280}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:18px;font-weight:700;color:#5E6280}
.stat .s{font-size:14px;color:#3B3F5C}
/* dialogs */
.ov{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:40px 24px;background:rgba(21,23,43,.55);overflow-y:auto}
.dlg{width:100%;max-width:620px;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(21,23,43,.35);overflow:hidden;margin:auto 0}
.dlg.w{max-width:720px}
.dh{position:relative;padding:22px 150px 20px 24px;background:#2A3A9E;color:#fff;overflow:hidden}
.dh .s1{position:absolute;right:92px;top:-20px;width:34px;height:160px;background:#D7262E;transform:skewX(-22deg)}
.dh .s2{position:absolute;right:76px;top:-20px;width:6px;height:160px;background:#fff;transform:skewX(-22deg)}
.dh .e{position:relative;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#DCE0FF}
.dh h2{position:relative;margin:4px 0 0;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;line-height:1.05;text-transform:uppercase}
.dh .sub{position:relative;font-size:14px;color:#DCE0FF;margin-top:4px}
.dh .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.db{padding:22px 24px;display:flex;flex-direction:column;gap:16px}
.df{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;background:#F7F7FA;border-top:1px solid #E3E4EC}
.infobox{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-radius:8px;background:#F7F7FA;box-shadow:inset 0 0 0 1px #E3E4EC;font-size:14px}
.line{display:flex;align-items:baseline;gap:16px;padding:14px 0;border-bottom:1px solid #EEEFF4}
.line .a{flex:1;display:flex;flex-direction:column;gap:2px}
.line .a b{font-weight:600;font-size:15px}
.line .amt{font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot{display:flex;align-items:baseline;gap:16px;padding:14px 16px;border-radius:8px;background:#E9ECFA}
.tot span:first-child{flex:1;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.tot span:last-child{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums}
/* attendance grid */
.th-date{position:relative}
.tip{position:absolute;top:calc(100% - 4px);left:50%;transform:translateX(-50%);z-index:5;display:none;width:220px;padding:10px 12px;border-radius:8px;background:#15172B;color:#fff;font-size:13px;font-weight:500;line-height:1.4;text-align:left;letter-spacing:0;text-transform:none;pointer-events:none;box-shadow:0 6px 18px rgba(21,23,43,.22)}
.th-date:hover .tip,.th-date:focus-within .tip,.cellw:hover .tip{display:block}
.cellw{position:relative}
.datebtn{width:48px;min-height:48px;border:0;border-radius:8px;background:transparent;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.datebtn:hover{background:#E9ECFA}
.datebtn .dw{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5E6280}
.datebtn .dd{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:20px;line-height:1;color:#2A3A9E}
.datebtn.fut .dd,.datebtn.fut .dw{color:#8A8DA6}
.datebtn.today{box-shadow:inset 0 0 0 2px #2A3A9E;background:#fff}
.mark{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;border-radius:6px;font-weight:800;font-size:14px}
.markbtn{border:0;padding:0;cursor:pointer;font-family:inherit}
.markbtn:hover{box-shadow:0 0 0 2px #2A3A9E}
.m-p{background:#E3F4EA;color:#17663A}.m-a{background:#D7262E;color:#fff}.m-u{background:#F3F3F7;box-shadow:inset 0 0 0 1px #E3E4EC}.m-n{color:#8A8DA6}
.namebtn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0;border:0;background:transparent;cursor:pointer;text-align:left;color:#15172B}
.namebtn:hover .nm{text-decoration:underline}
.sticky{position:sticky;left:0;z-index:1;background:#fff}
th.sticky{background:#F7F7FA}
.toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:132px;padding:0 18px;border:0;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;font-size:13px;color:#3B3F5C}
.legend span{display:inline-flex;align-items:center;gap:6px}
.cmin{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:30px;padding:0 4px;border-radius:6px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
/* student profile */
.prof .bandtop{position:relative;height:112px;background:#2A3A9E;overflow:hidden}
.prof .bandtop .s1{position:absolute;right:120px;top:-20px;width:150px;height:170px;background:#D7262E;transform:skewX(-24deg)}
.prof .bandtop .s2{position:absolute;right:96px;top:-20px;width:14px;height:170px;background:#fff;transform:skewX(-24deg)}
.prof .bandtop .big{position:absolute;left:260px;bottom:18px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:120px;line-height:.8;color:#3446AE}
.prof .bandtop .bk{position:absolute;left:20px;top:16px;color:#fff}
.photo{width:132px;height:160px;margin-top:-48px;flex:none;position:relative;background:#fff;box-shadow:inset 0 0 0 3px #D7262E,0 8px 24px rgba(27,36,102,.18);display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:56px;color:#2A3A9E}
.photo.off{box-shadow:inset 0 0 0 3px #B9BBCC,0 8px 24px rgba(27,36,102,.18);color:#8A8DA6}
.ptabs{display:flex;gap:4px;padding:0 20px;border-top:1px solid #ECEDF3}

<script>
'use strict';
/* ============ helpers ============ */
const KEY = 'psa_student_app_v2';
const h = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = (n) => (n < 10 ? '0' : '') + n;
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYS = [['mon', 'Mon', 'Monday', 1], ['tue', 'Tue', 'Tuesday', 2], ['wed', 'Wed', 'Wednesday', 3], ['thu', 'Thu', 'Thursday', 4], ['fri', 'Fri', 'Friday', 5], ['sat', 'Sat', 'Saturday', 6], ['sun', 'Sun', 'Sunday', 0]];
const isoOf = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const toD = (s) => { const p = String(s).split('-'); return new Date(+p[0], +p[1] - 1, +(p[2] || 1)); };
const NOW = new Date();
const TODAY = isoOf(NOW);
const CUR_YM = TODAY.slice(0, 7);
const fmtD = (s) => { if (!s) return '—'; const d = toD(s); return pad(d.getDate()) + '-' + MON[d.getMonth()] + '-' + d.getFullYear(); };
const fmtShort = (s) => { const d = toD(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const fmtLong = (s) => fmtShort(s) + ' ' + toD(s).getFullYear();
const fmtWhen = (iso) => { const t = new Date(iso); return pad(t.getDate()) + '-' + MON[t.getMonth()] + '-' + t.getFullYear() + ', ' + pad(t.getHours()) + ':' + pad(t.getMinutes()); };
const ymShift = (ym, k) => { const y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + k; const d = new Date(y, m, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
const ymLabel = (ym) => MONTHS[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const ymShort = (ym) => MON[+ym.slice(5, 7) - 1] + ' ' + ym.slice(0, 4);
const daysIn = (ym) => new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
const money = (n) => Number(n || 0).toLocaleString('en-US');
const money2 = (n) => Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const squash = (s) => String(s || '').trim().replace(/\s+/g, ' ');
const digits = (s) => String(s || '').replace(/\D/g, '');
const initials = (n) => String(n || '').split(' ').filter(Boolean).slice(0, 2).map((w) => w[0].toUpperCase()).join('') || '?';
const ageOf = (dob) => { if (!dob) return null; const b = toD(dob); let a = NOW.getFullYear() - b.getFullYear(); const m = NOW.getMonth() - b.getMonth(); if (m < 0 || (m === 0 && NOW.getDate() < b.getDate())) a--; return a; };
const q = (s) => '“' + s + '”';
const daysText = (ids) => DAYS.filter((d) => (ids || []).includes(d[0])).map((d) => d[1]).join(', ');
const dowsOf = (ids) => DAYS.filter((d) => (ids || []).includes(d[0])).map((d) => d[3]);
const plural = (n, a, b) => n + ' ' + (n === 1 ? a : (b || a + 's'));
const NUM_WORDS = ['zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
const TENS = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
function words(n) {
  n = Math.floor(n);
  if (n < 20) return NUM_WORDS[n];
  if (n < 100) return TENS[Math.floor(n / 10)] + (n % 10 ? '-' + NUM_WORDS[n % 10] : '');
  if (n < 1000) return NUM_WORDS[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' and ' + words(n % 100) : '');
  if (n < 1000000) return words(Math.floor(n / 1000)) + ' thousand' + (n % 1000 ? (n % 1000 < 100 ? ' and ' : ' ') + words(n % 1000) : '');
  return String(n);
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

/* ============ icons ============ */
const I = {
  plus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',

  print: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="1.5"/><path d="M7 14h10v7H7z"/></svg>',
  down: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 10l5 5 5-5M4 17v3h16v-3"/></svg>',
  info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2A3A9E" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:none;margin-top:1px"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  lock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  bus: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="14" rx="3"/><path d="M4 11h16M8 17v3M16 17v3"/></svg>',
  reactivate: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v4h4"/></svg>',
  logo: '<svg width="40" height="46" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2.5l16.5 5v13.5c0 10.5-7.5 17.5-16.5 21.5C11 38.5 3.5 31.5 3.5 21V7.5z" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><path d="M9 33l11 5 11-5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/><text x="20" y="26" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">PSA</text></svg>'
};
const MODE_ICON = {
  Cash: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/></svg>',
  Card: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19M6 15h4"/></svg>',
  'Bank transfer': '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-5 9 5"/><path d="M5 10v7M10 10v7M14 10v7M19 10v7M3 20h18"/></svg>',
  Cheque: '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="1.5"/><path d="M6 14c1.5-2 2.5-2 3 0s1.5 2 3 0M15 14h4M6 10h12"/></svg>'
};
const MODES = ['Cash', 'Card', 'Bank transfer', 'Cheque'];

/* ============ sample data (first run only) ============ */
function seed(keepPw) {
  // empty app: no records and no settings; only the login password state is kept
  return {
    v: 2,
    seq: { student: 0 },
    settings: { academyName: '', academyPhone: '', academyEmail: '', lockMinutes: '', passwordChanged: keepPw || '', regPrefix: '', regSep: '', docsFolder: '', backupFolder: '', maxUploadMb: '', startWithWindows: false, logo: null,
      regFee: '', overdueDay: '', book: '', start: '', nextNo: '', address: '', phone: '', email: '' },
    locations: [], batches: [], routes: [], coaches: [], students: [],
    brec: {}, trec: {}, dues: [], duesRun: {},
    att: { absent: {}, plans: {}, overrides: {}, coachMin: {} },
    backups: []
  };
}

/* ============ state ============ */
let S;
const SETTING_DEFAULTS = { academyName: '', academyPhone: '', academyEmail: '', lockMinutes: '', passwordChanged: '', regPrefix: '', regSep: '', docsFolder: '', backupFolder: '', maxUploadMb: '', startWithWindows: false, logo: null };
function load() {
  try { const raw = localStorage.getItem(KEY); if (raw) S = JSON.parse(raw); } catch (e) { /* ignore */ }
  if (!S) { let pw = ''; try { const old = JSON.parse(localStorage.getItem('psa_student_app_v1') || 'null'); pw = (old && old.settings && old.settings.passwordChanged) || ''; } catch (e) { /* none */ } S = seed(pw); }
  Object.keys(SETTING_DEFAULTS).forEach((k) => { if (S.settings[k] === undefined) S.settings[k] = SETTING_DEFAULTS[k]; });
  (S.backups || []).forEach((b) => { delete b.data; });
  save();
}
const regNo = (n) => S.settings.regPrefix + S.settings.regSep + String(n).padStart(4, '0');
const maxBytes = () => (+S.settings.maxUploadMb || 0) * 1024 * 1024;
const missing = (what) => what + ' is not set. Set it in Settings first.';
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); return true; } catch (e) { return false; } }
// Academy logo for every printed report (receipt now; any report added later should call this too)
const LOGO_TYPES = { 'image/png': 'PNG', 'image/jpeg': 'JPG', 'image/svg+xml': 'SVG' };
const LOGO_MAX_MB = 2;
function reportLogo(px) {
  const lg = S.settings && S.settings.logo;
  if (lg && lg.data) return '<span style="flex:none;width:' + px + 'px;height:' + px + 'px;display:flex;align-items:center;justify-content:center;padding:6px;border-radius:8px;background:#fff"><img src="' + lg.data + '" alt="' + h((S.settings.academyName || 'Academy') + ' logo') + '" style="max-width:100%;max-height:100%;object-fit:contain"></span>';
  return '<svg width="' + Math.round(px * 0.87) + '" height="' + px + '" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 2.5l16.5 5v13.5c0 10.5-7.5 17.5-16.5 21.5C11 38.5 3.5 31.5 3.5 21V7.5z" fill="none" stroke="#FFFFFF" stroke-width="2.4"/><path d="M9 33l11 5 11-5" fill="none" stroke="#FFFFFF" stroke-width="1.6"/><text x="20" y="26" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="800" font-size="14" fill="#FFFFFF">PSA</text></svg>';
}
function clearStudents() { if (!confirm('Clear all student data? Every student, their batch and transport records, fees, payments, student attendance and documents saved in this browser is deleted, and student numbers start again from 1. Masters (locations, batches, routes, coaches) and settings stay.')) return; Object.assign(S, { students: [], brec: {}, trec: {}, dues: [], duesRun: {} }); S.seq.student = 0; S.att.absent = {}; save(); U = freshU(); location.hash = '#registration'; U.page = 'registration'; flash('All student data cleared'); render(); }
function resetData() { if (!confirm('Clear all data? Every student, master, fee, attendance record, backup log entry and setting saved in this browser is deleted. Only the login password stays.')) return; S = seed(S.settings && S.settings.passwordChanged); save(); U = freshU(); location.hash = '#batches'; render(); }

const U0 = () => ({ flash: null, flashBad: false, dlg: null });
let U = freshU();
function freshU() { return Object.assign(U0(), { page: 'batches', v: {}, f: null }); }
function flash(msg, bad, act) { U.flash = msg; U.flashBad = !!bad; U.flashAct = act ? { msg, label: act[0], js: act[1] } : null; }

/* ============ lookups ============ */
const byId = (arr, id) => arr.find((x) => x.id === id) || null;
const batchOf = (id) => byId(S.batches, id);
const routeOf = (id) => byId(S.routes, id);
const coachOf = (id) => byId(S.coaches, id);
const studentOf = (id) => byId(S.students, id);
const locName = (id) => (byId(S.locations, id) || { name: '—' }).name;
function classDatesOf(b, ym) {
  const out = []; const dows = dowsOf(b.days); const n = daysIn(ym);
  for (let d = 1; d <= n; d++) { const iso = ym + '-' + pad(d); if (dows.includes(toD(iso).getDay())) out.push(iso); }

  try { return (await hd.requestPermission(o)) === 'granted'; } catch (e) { return false; }

  put: (v) => { try { localStorage.setItem(AUTH_KEY, JSON.stringify(v)); return true; } catch (e) { return false; } },

  isDefault: () => AUTH.store().hash === sha256('admin'),
  setPassword: (pw) => AUTH.put({ user: DEFAULT_USER, hash: sha256(pw), changed: new Date().toISOString() }),
  signedIn: () => { try { return sessionStorage.getItem(SESS_KEY) === '1'; } catch (e) { return AUTH.mem; } },
  login: () => {
    const u = (document.getElementById('lg-u').value || '').trim(); const p = document.getElementById('lg-p').value || '';
    AUTH.msg = null;
    if (!u || !p) { AUTH.err = { u: u ? '' : 'Enter the username.', p: p ? '' : 'Enter the password.', both: '', uv: u }; render(); return; }
    if (u !== AUTH.store().user || !AUTH.check(p)) { AUTH.err = { u: '', p: '', both: 'The username or password is incorrect.', uv: u }; render(); const el = document.getElementById('lg-p'); if (el) el.focus(); return; }
    AUTH.err = null; AUTH.show = false; AUTH.mem = true;
    try { sessionStorage.setItem(SESS_KEY, '1'); } catch (e) { /* in-memory only */ }
    IDLE.touch(true);
    U = freshU(); U.page = PAGES[location.hash.slice(1)] ? location.hash.slice(1) : 'batches'; render(); window.scrollTo(0, 0);
  },
  logout: (msg) => {
    AUTH.mem = false; try { sessionStorage.removeItem(SESS_KEY); sessionStorage.removeItem(LAST_KEY); } catch (e) { /* none */ }
    AUTH.msg = msg || null; AUTH.err = null; AUTH.show = false; U = freshU(); BK_SRC = null; render();
  },
  toggleShow: () => { const el = document.getElementById('lg-p'); if (!el) return; AUTH.show = !AUTH.show; el.type = AUTH.show ? 'text' : 'password'; const b = document.getElementById('lg-eye'); if (b) b.setAttribute('aria-label', AUTH.show ? 'Hide password' : 'Show password'); el.focus(); }
};
// sign out after the inactivity time set in Settings (blank = never)
const IDLE = {
  last: Date.now(),
  touch: (force) => { const now = Date.now(); if (!force && now - IDLE.last < 5000) return; IDLE.last = now; try { sessionStorage.setItem(LAST_KEY, String(now)); } catch (e) { /* none */ } },
  check: () => {
    if (!AUTH.signedIn()) return false; const m = +S.settings.lockMinutes; if (!(m > 0)) return false;
    let last = IDLE.last; try { last = Math.max(last, +(sessionStorage.getItem(LAST_KEY) || 0)); } catch (e) { /* none */ }
    if (Date.now() - last > m * 60000) { AUTH.logout('You were signed out after ' + m + ' minutes without activity.'); return true; }
    return false;
  }
};
