<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batches — PSA</title>
<!-- Barlow loads when online; offline the system fonts below are used. -->
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#2A3A9E; --night:#1B2466; --red:#D7262E; --red-dark:#A3141B;
  --ink:#15172B; --label:#3B3F5C; --slate:#5E6280;
  --fill:#ECEAF2; --tint:#E9ECFA; --canvas:#F3F3F7; --row:#F7F7FA;
  --line:#E3E4EC; --line-2:#ECEDF3;
  --ok-bg:#E3F4EA; --ok:#17663A; --off-bg:#ECECF1; --off:#4E5170; --err-bg:#FDF1F1;
  --body:'Barlow','Segoe UI',Arial,sans-serif;
  --display:'Barlow Condensed','Arial Narrow','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);font-size:15px;color:var(--ink);background:var(--canvas);min-height:100vh;line-height:1.45}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.topbar{background:#fff;box-shadow:0 1px 0 var(--line)}
.topbar-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding:12px 32px 4px;min-height:68px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.topbar h1{margin:2px 0 0;font-family:var(--display);font-weight:800;font-size:30px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.nav{display:flex;gap:4px;padding:0 24px}
.nav a{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;font-weight:700;font-size:15px;color:var(--slate);text-decoration:none}
.nav a[aria-current="page"]{color:var(--blue);box-shadow:inset 0 -3px 0 var(--red)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 24px;border:0;border-radius:8px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-create{min-height:44px;padding:0 18px;background:var(--red);color:#fff}
.btn-primary{background:var(--blue);color:#fff;padding:0 26px}
.btn-secondary{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #DADBE6;padding:0 22px}
.btn-tonal{min-height:36px;padding:0 14px;border-radius:6px;background:var(--tint);color:var(--night);font-size:14px}
.btn-icon{width:44px;height:44px;min-height:44px;padding:0;background:var(--tint);color:var(--night)}
.btn-link{min-height:40px;padding:0 10px;background:transparent;color:var(--blue)}
.btn-back{align-self:flex-start;min-height:40px;padding:0 12px 0 6px;border-radius:6px;background:transparent;color:var(--blue)}

/* layout */
main{width:100%;max-width:1240px;padding:32px;display:flex;flex-direction:column;gap:20px}
.card{background:#fff;border-radius:14px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.flash{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--ok-bg);color:var(--ok);font-size:14px;font-weight:700}
.flash::before,.chip-status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.banner{padding:14px 18px;border-radius:10px;background:var(--err-bg);box-shadow:inset 0 0 0 2px var(--red);color:var(--red-dark);font-size:15px;font-weight:700}

/* list card */
.card-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px;padding:22px 28px;border-bottom:1px solid var(--line-2)}
.card-head h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.16em;text-transform:uppercase}
.head-left{display:flex;align-items:center;gap:12px}
.count{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;color:var(--blue);background:var(--tint);padding:3px 10px;border-radius:4px}
.hint{font-size:13px;color:var(--slate)}
.head-right{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
.filter{display:flex;align-items:center;gap:10px}
.filter label{font-size:13px;font-weight:600;color:var(--label)}
.filter select{height:44px;min-width:150px;padding:0 10px;border:0;border-radius:6px;background:var(--fill);font-size:15px;font-weight:600;color:var(--ink);cursor:pointer}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;padding:12px 16px;background:var(--row);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--slate);border-bottom:1px solid var(--line)}
td{padding:14px 16px;border-bottom:1px solid var(--line-2);vertical-align:top}
.list th:first-child,.list td:first-child{padding-left:28px}
.list th:last-child,.list td:last-child{padding-right:28px;text-align:right}
.list td:last-child{padding-top:10px;padding-bottom:10px}
.num{text-align:right !important;font-variant-numeric:tabular-nums}
.list tbody tr{cursor:pointer;user-select:none}
.list tbody tr:hover td{background:var(--row)}
.list tr.inactive td{color:var(--slate)}
.sub{font-size:13px;color:var(--slate)}
.chip{display:inline-block;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--blue);background:var(--tint);padding:3px 8px;border-radius:4px}
.chip-lg{font-size:17px;padding:3px 10px}
.chip-status{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.chip-status.on{background:var(--ok-bg);color:var(--ok)}
.chip-status.off{background:var(--off-bg);color:var(--off)}
.empty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:56px 24px;text-align:center}
.empty strong{font-family:var(--display);font-weight:800;font-size:28px;text-transform:uppercase;color:var(--blue)}

/* details */
.detail-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding:28px 32px;border-bottom:1px solid var(--line-2)}
.title-xl{margin:0;font-family:var(--display);font-weight:800;font-size:44px;line-height:.95;letter-spacing:.01em;text-transform:uppercase;color:var(--blue);word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.month-box{display:flex;flex-direction:column;gap:4px;padding:12px 16px;border-radius:8px;background:var(--canvas);min-width:200px}
.month-box .lbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.month-box .big{font-family:var(--display);font-weight:800;font-size:26px}
.head-actions{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:10px;background:var(--row)}
.tile .lbl{font-size:12px;font-weight:600;color:var(--slate)}
.tile .val{font-size:16px;font-weight:700;word-break:break-word}
.tile.full{grid-column:1/-1}
.tile.full .val{font-size:15px;font-weight:500;color:var(--label);white-space:pre-wrap}
.month-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.month-nav{display:flex;align-items:center;gap:8px}
.month-label{min-width:200px;text-align:center;font-family:var(--display);font-weight:800;font-size:26px;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;padding:6px 12px;border-radius:999px;background:var(--tint);color:var(--night);font-size:14px;font-weight:700}
.dates{border-radius:10px;box-shadow:0 0 0 1px var(--line);overflow:hidden}
.dates td:first-child{width:64px;font-weight:700;color:var(--slate);font-variant-numeric:tabular-nums}
.dates td:last-child{font-weight:700}
.placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;padding:32px 24px;border-radius:10px;background:var(--row);box-shadow:inset 0 0 0 2px var(--line);text-align:center}
.placeholder strong{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;color:var(--blue)}
.para{margin:0;font-size:14px;line-height:1.5;color:var(--label)}

/* forms */
.form-head{display:flex;flex-direction:column;gap:6px;padding:28px 32px;border-bottom:1px solid var(--line-2)}
.req{color:var(--red);font-weight:700}
.section{padding:28px 32px 32px;display:flex;flex-direction:column;gap:24px}
.section + .section{padding-top:8px}
.band{display:flex;align-items:stretch;height:44px}
.band .letter{width:52px;flex:none;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:22px;clip-path:polygon(0 0,100% 0,80% 100%,0 100%)}
.band h3{flex:1;margin:0 0 0 -8px;background:var(--blue);color:#fff;display:flex;align-items:center;padding:0 20px 0 26px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:.18em;text-transform:uppercase;clip-path:polygon(12px 0,100% 0,100% 100%,0 100%)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 24px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0;margin:0;padding:0;border:0}
.field.full{grid-column:1/-1}
.field > label,.field > legend{font-size:13px;font-weight:600;color:var(--label);padding:0}
.field > legend{margin-bottom:7px}
.input,.textarea,.select{width:100%;border:0;border-radius:6px;background:var(--fill);font-size:16px;font-weight:500;color:var(--ink)}
.input,.select{height:46px;padding:0 14px}
.select{padding:0 10px}
.textarea{padding:12px 14px;line-height:1.5;resize:vertical;min-height:88px}
.money{display:flex;align-items:center;height:46px;border-radius:6px;background:var(--fill);padding-right:14px}
.money input{flex:1;min-width:0;height:46px;padding:0 14px;border:0;background:transparent;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.money span{font-size:13px;font-weight:700;color:var(--slate)}
.field.invalid .input,.field.invalid .select,.field.invalid .money{background:var(--err-bg);box-shadow:inset 0 0 0 2px var(--red)}
.msg{font-size:12px;font-weight:700;color:var(--red-dark)}
.help{font-size:12px;color:var(--slate)}
.options{display:flex;flex-wrap:wrap;gap:8px}
.opt{flex:1 1 96px;display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:6px;background:var(--fill);font-size:15px;font-weight:500;color:var(--ink);cursor:pointer}
.opt input{accent-color:var(--blue);width:18px;height:18px;margin:0;cursor:pointer}
.opt:has(input:checked){background:var(--tint);box-shadow:inset 0 0 0 2px var(--blue);font-weight:700;color:var(--night)}
.opt.status{flex:0 1 180px}
.footer{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:18px 32px;background:#fff;box-shadow:0 -1px 0 var(--line)}
.footer .status{font-size:14px;color:var(--slate);min-height:20px}
.footer .status.error{color:var(--red-dark);font-weight:700}
.actions{display:flex;flex-wrap:wrap;gap:12px}

@media (max-width:640px){
  .topbar-row,main,.section,.form-head,.footer,.detail-head{padding-left:16px;padding-right:16px}
  .nav{padding:0 8px}
  .title-xl{font-size:34px}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <div>
      <div class="eyebrow">Masters</div>
      <h1 id="page-title">Batches</h1>
    </div>
    <a class="btn btn-create" id="btn-create" href="#/batches/new">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span id="btn-create-label">New batch</span>
    </a>
  </div>
  <nav class="nav" aria-label="Masters">
    <a href="#/batches" id="nav-batches">Batches</a>
    <a href="#/locations" id="nav-locations">Locations</a>
  </nav>
</header>
<main id="app"></main>

<script>
(function () {
  'use strict';

  /* ===================== store ===================== */
  var KEY_VER = 'psa.schemaVersion', KEY_LOC = 'psa.locations', KEY_BAT = 'psa.batches';
  var MSG_UNREADABLE = 'Saved data could not be read. Nothing has been changed. Contact support before continuing.';
  var MSG_SAVE_FAIL = 'Could not save. Your changes have not been stored.';
  var storageBroken = false;

  function newId(prefix, arr) {
    var id;
    do {
      id = prefix + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6).padEnd(4, '0');
    } while (arr.some(function (r) { return r.id === id; }));
    return id;
  }
  function nowIso() { return new Date().toISOString(); }

  // Returns array, or null when the key is missing. Marks storage broken on bad data.
  function readArr(key) {
    var raw;
    try { raw = window.localStorage.getItem(key); } catch (e) { storageBroken = true; return []; }
    if (raw === null) return null;
    try {
      var v = JSON.parse(raw);
      if (!Array.isArray(v)) { storageBroken = true; return []; }
      return v;
    } catch (e) { storageBroken = true; return []; }
  }
  function writeArr(key, arr) {
    try { window.localStorage.setItem(key, JSON.stringify(arr)); return true; } catch (e) { return false; }
  }
  function normLoc(l) {
    return { id: String(l.id), name: String(l.name || ''), description: String(l.description || ''),
      isActive: l.isActive !== false, createdAt: l.createdAt || '', updatedAt: l.updatedAt || '' };
  }
  function normBat(b) {
    return { id: String(b.id), name: String(b.name || ''), description: String(b.description || ''),
      locationId: String(b.locationId || ''), ageCategory: String(b.ageCategory || ''),
      classDays: Array.isArray(b.classDays) ? b.classDays.map(Number).filter(function (d) { return d >= 1 && d <= 7; }) : [],
      monthlyFee: Number(b.monthlyFee) || 0, isActive: b.isActive !== false,
      createdAt: b.createdAt || '', updatedAt: b.updatedAt || '' };
  }
  var store = {
    init: function () {
      try { window.localStorage.getItem(KEY_VER); } catch (e) { storageBroken = true; return; }
      var locs = readArr(KEY_LOC);
      var bats = readArr(KEY_BAT);
      if (storageBroken) return;
      if (locs === null) {
        var t = nowIso();
        var seed = [];
        seed.push({ id: newId('loc_', seed), name: 'DCA', description: '', isActive: true, createdAt: t, updatedAt: t });
        seed.push({ id: newId('loc_', seed), name: 'Repton', description: '', isActive: true, createdAt: t, updatedAt: t });
        writeArr(KEY_LOC, seed);
        try { window.localStorage.setItem(KEY_VER, '1'); } catch (e) { /* ignore */ }
      }
      if (bats === null) writeArr(KEY_BAT, []);
    },
    getLocations: function () { var a = readArr(KEY_LOC); return (a || []).map(normLoc); },
    getBatches: function () { var a = readArr(KEY_BAT); return (a || []).map(normBat); },
    save: function (key, rec) {
      var arr = readArr(key);
      if (storageBroken) return false;
      arr = arr || [];
      var i = arr.findIndex(function (r) { return r.id === rec.id; });
      if (i >= 0) arr[i] = rec; else arr.push(rec);
      return writeArr(key, arr);
    }
  };

  /* ===================== dates & formatting ===================== */
  var DAY_SHORT = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  var DAY_FULL = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
  function isoWeekday(d) { var g = d.getDay(); return g === 0 ? 7 : g; }
  function classDates(days, year, month) {
    var out = [], n = new Date(year, month + 1, 0).getDate();
    for (var day = 1; day <= n; day++) {
      var d = new Date(year, month, day);
      if (days.indexOf(isoWeekday(d)) !== -1) out.push(d);
    }
    return out;
  }
  function monthLabel(year, month) { return new Date(year, month, 1).toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); }
  function classDateLabel(d) { return d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function daysText(days) { return days.slice().sort(function (a, b) { return a - b; }).map(function (d) { return DAY_SHORT[d - 1]; }).join(', '); }
  function feeText(n) { return 'AED ' + Number(n).toLocaleString('en-US'); }
  function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
  function thisMonth() { var t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; }
  function shiftMonth(off) { var t = thisMonth(); var d = new Date(t.y, t.m + off, 1); return { y: d.getFullYear(), m: d.getMonth() }; }

  /* ===================== ui helpers ===================== */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function byName(a, b) { return a.name.localeCompare(b.name, 'en', { sensitivity: 'base' }); }
  function activeFirst(list) {
    return list.filter(function (r) { return r.isActive; }).sort(byName)
      .concat(list.filter(function (r) { return !r.isActive; }).sort(byName));
  }
  function statusChip(on) { return on ? '<span class="chip-status on">Active</span>' : '<span class="chip-status off">Inactive</span>'; }
  var ICON_PLUS = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
  var ICON_BACK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  var ICON_NEXT = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';
  var ICON_PREV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
  var ICON_CHECK = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
  function band(letter, title) { return '<div class="band"><div class="letter" aria-hidden="true">' + letter + '</div><h3>' + esc(title) + '</h3></div>'; }

  var app = document.getElementById('app');
  var flash = '';          // shown once on the next render
  var oneTimeBanner = '';  // shown once on the next render
  var monthOffset = 0;     // batch details month
  // Status filter per list: Active on open; kept while moving between list and forms (not saved).
  var filters = { batches: 'active', locations: 'active' };
  function applyFilter(list, f) {
    if (f === 'active') return list.filter(function (r) { return r.isActive; }).sort(byName);
    if (f === 'inactive') return list.filter(function (r) { return !r.isActive; }).sort(byName);
    return activeFirst(list);
  }
  function filterControl(section) {
    var f = filters[section];
    var opt = function (v, label) { return '<option value="' + v + '"' + (f === v ? ' selected' : '') + '>' + label + '</option>'; };
    return '<div class="filter"><label for="status-filter">Status</label>' +
      '<select id="status-filter" data-section="' + section + '">' + opt('active', 'Active') + opt('inactive', 'Inactive') + opt('all', 'All') + '</select></div>';
  }
  function filterEmpty(section) {
    var noun = section === 'batches' ? 'batches' : 'locations';
    var title = filters[section] === 'active' ? 'No active ' + noun : 'No inactive ' + noun;
    return '<div class="empty"><strong>' + title + '</strong><span class="hint" style="font-size:15px">Change the filter to see other ' + noun + '.</span></div>';
  }
  function go(hash) { if (location.hash === hash) render(); else location.hash = hash; }
  function topMessages() {
    var html = '';
    if (storageBroken) html += '<div class="banner" role="alert">' + esc(MSG_UNREADABLE) + '</div>';
    if (oneTimeBanner) html += '<div class="banner" role="alert">' + esc(oneTimeBanner) + '</div>';
    if (flash) html += '<div class="flash" role="status">' + esc(flash) + '</div>';
    flash = ''; oneTimeBanner = '';
    return html;
  }
  function setChrome(section, isList, title) {
    var batches = section === 'batches';
    document.getElementById('page-title').textContent = batches ? 'Batches' : 'Locations';
    var nb = document.getElementById('nav-batches'), nl = document.getElementById('nav-locations');
    if (batches) { nb.setAttribute('aria-current', 'page'); nl.removeAttribute('aria-current'); }
    else { nl.setAttribute('aria-current', 'page'); nb.removeAttribute('aria-current'); }
    var create = document.getElementById('btn-create');
    create.hidden = !isList;
    create.setAttribute('href', batches ? '#/batches/new' : '#/locations/new');
    document.getElementById('btn-create-label').textContent = batches ? 'New batch' : 'New location';
    document.title = title;
  }
  function notFound(listHash) {
    oneTimeBanner = 'That record was not found.';
    history.replaceState(null, '', listHash);
    render();
  }

  /* ===================== router ===================== */
  function render() {
    var parts = (location.hash || '').replace(/^#\/?/, '').split('/').filter(Boolean);
    var section = parts[0];
    if (section !== 'locations' && section !== 'batches') {
      history.replaceState(null, '', '#/batches');
      parts = ['batches']; section = 'batches';
    }
    var id = parts[1], sub = parts[2];
    if (section === 'locations') {
      if (!id) return renderLocationList();
      if (id === 'new') return renderLocationForm(null);
      return renderLocationForm(id);
    }
    if (!id) return renderBatchList();
    if (id === 'new') return renderBatchForm(null);
    if (sub === 'edit') return renderBatchForm(id);
    return renderBatchDetail(id);
  }

      '</form>';

    var form = document.getElementById('bat-form');
    var nameIn = document.getElementById('b-name'), locIn = document.getElementById('b-loc'),
      ageIn = document.getElementById('b-age'), descIn = document.getElementById('b-desc'), feeIn = document.getElementById('b-fee');
    if (b) {
      nameIn.value = b.name; locIn.value = b.locationId; ageIn.value = b.ageCategory; descIn.value = b.description;
      feeIn.value = String(b.monthlyFee);
      b.classDays.forEach(function (d) { var c = form.querySelector('input[name="day"][value="' + d + '"]'); if (c) c.checked = true; });
    }
    form.querySelector('input[name="status"][value="' + (b && !b.isActive ? 'inactive' : 'active') + '"]').checked = true;
    var submitted = false;
    var feeRefused = false;

    // Monthly fee: refuse anything but digits; never strip characters.
    function refuseFee() {
      feeRefused = true;
      setFieldError(form, 'fee', 'b-fee-msg', feeIn, 'Whole dirhams only, no decimals.');
    }
    feeIn.addEventListener('beforeinput', function (e) {
      if (e.inputType === 'insertFromPaste' || e.inputType === 'insertFromDrop') return; // handled below
      if (typeof e.data === 'string' && /[^0-9]/.test(e.data)) { e.preventDefault(); refuseFee(); }
    });
    feeIn.addEventListener('paste', function (e) {
      var text = (e.clipboardData || window.clipboardData).getData('text');
      if (/[^0-9]/.test(text)) { e.preventDefault(); refuseFee(); }
    });
    feeIn.addEventListener('drop', function (e) {
      var text = e.dataTransfer ? e.dataTransfer.getData('text') : '';
      if (/[^0-9]/.test(text)) { e.preventDefault(); refuseFee(); }
    });
    feeIn.addEventListener('input', function () {
      if (feeRefused) {
        feeRefused = false;
        if (submitted) show(validate()); else setFieldError(form, 'fee', 'b-fee-msg', feeIn, '');
      }
    });

    function checkedDays() {
      return Array.prototype.map.call(form.querySelectorAll('input[name="day"]:checked'), function (c) { return Number(c.value); }).sort(function (x, y) { return x - y; });
    }
    function validate() {
      var errs = {};
      var name = nameIn.value.trim(), locId = locIn.value, age = ageIn.value.trim(), fee = feeIn.value;

      if (!name) errs.name = 'Enter a batch name.';

      if (!locId) errs.location = 'Choose a location.';
      if (!age) errs.age = 'Enter an age category.';
      if (checkedDays().length === 0) errs.days = 'Select at least one day.';
      if (!/^[1-9][0-9]{0,6}$/.test(fee)) errs.fee = 'Enter a whole amount above 0.';
      var active = form.querySelector('input[name="status"]:checked').value === 'active';
      var chosen = freshLocs.find(function (l) { return l.id === locId; });
      if (active && chosen && !chosen.isActive) errs.status = chosen.name + ' is inactive. Choose an active location or make the location active first.';
      return errs;
    }
    function show(errs) {
      setFieldError(form, 'name', 'b-name-msg', nameIn, errs.name);
      setFieldError(form, 'location', 'b-loc-msg', locIn, errs.location);
      setFieldError(form, 'age', 'b-age-msg', ageIn, errs.age);
      setFieldError(form, 'days', 'b-days-msg', null, errs.days);
      setFieldError(form, 'fee', 'b-fee-msg', feeIn, errs.fee);
      setFieldError(form, 'status', 'b-status-msg', null, errs.status);
      var st = document.getElementById('form-status');
      var bad = Object.keys(errs).length > 0;
      st.classList.toggle('error', bad);
      st.textContent = bad ? 'Fix the highlighted fields to save this batch.' : footerIdle;
    }
    form.addEventListener('input', function () { if (submitted) show(validate()); });
    form.addEventListener('change', function () { if (submitted) show(validate()); });
    form.addEventListener('submit', function (e) {
      e.preventDefault();
      submitted = true; feeRefused = false;
      var errs = validate();
      show(errs);
      if (Object.keys(errs).length) { focusFirstInvalid(form); return; }
      var t = nowIso();
      var rec = b ? Object.assign({}, b) : { id: newId('bat_', store.getBatches()), createdAt: t };
      rec.name = nameIn.value.trim();
      rec.description = descIn.value.trim();
      rec.locationId = locIn.value;
      rec.ageCategory = ageIn.value.trim();
      rec.classDays = checkedDays();
      rec.monthlyFee = parseInt(feeIn.value, 10);
      rec.isActive = form.querySelector('input[name="status"]:checked').value === 'active';
      rec.updatedAt = t;
      if (!store.save(KEY_BAT, rec)) { showSaveFail(); return; }
      if (b) { flash = 'Details saved'; go('#/batches/' + rec.id); }
      else { flash = 'Batch “' + rec.name + '” created'; go('#/batches'); }
    });
  }

  /* ===================== shared form helpers ===================== */
  function setFieldError(form, field, msgId, control, text) {
    var wrap = form.querySelector('[data-field="' + field + '"]');
    var msg = document.getElementById(msgId);
    var on = !!text;
    if (wrap) wrap.classList.toggle('invalid', on);
    if (control) control.setAttribute('aria-invalid', on ? 'true' : 'false');
    msg.hidden = !on;
    msg.textContent = on ? text : '';
  }
  function focusFirstInvalid(form) {
    var first = form.querySelector('.invalid');
    if (!first) return;
    var c = first.querySelector('input, select, textarea');
    if (c) c.focus();
  }
  function showSaveFail() {
    var old = app.querySelector('.banner.save-fail');
    if (old) old.remove();
    var div = document.createElement('div');
    div.className = 'banner save-fail';
    div.setAttribute('role', 'alert');
    div.textContent = MSG_SAVE_FAIL;
    app.insertBefore(div, app.firstChild);
  }

  /* ===================== status filter ===================== */
  app.addEventListener('change', function (e) {
    var sel = e.target;
    if (sel.id !== 'status-filter') return;
    var section = sel.getAttribute('data-section');
    filters[section] = sel.value;
    if (section === 'batches') renderBatchList(); else renderLocationList();
    var again = document.getElementById('status-filter');
    if (again) again.focus();
  });

  /* ===================== row open: double-click ===================== */
  app.addEventListener('dblclick', function (e) {
    var tr = e.target.closest('tr[data-open]');
    if (tr && !e.target.closest('a,button')) go(tr.getAttribute('data-open'));
  });

  /* ===================== start ===================== */
  window.addEventListener('hashchange', function () {
    monthOffset = 0;
    render();
    window.scrollTo(0, 0);
  });
  store.init();
  render();
})();
</script>
</body>
</html>
